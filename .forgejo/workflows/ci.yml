name: CI

on:
  # ⚠ **Run on push only for main** (2026-09-30). Branches are checked by pull_request.
  #   When this ran on every branch, branches with a PR (Renovate branches etc.) ran the
  #   same checks twice per commit, using twice the runners, and since main protection
  #   requires every check to be green, one flaky push run turned the PR red (#20).
  push:
    branches: ["main"]
    tags-ignore: ["v*"]
  pull_request:

# On repeated pushes to the same branch (PR), cancel older runs and check only the latest commit.
# ⚠ **main is cancelled too** (decided 2026-09-28). Intermediate commits get no result, but
#   on days with many pushes to main, stale checks do not clog the runner queue. Do not apply this to workflows with side effects.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Quality gate (see CLAUDE.md "Tests" / docs/OPERATIONS.md)
#   Backend : Ruff Format → Ruff Check → MyPy → PyTest
#   Frontend: Prettier → ESLint → TypeScript → Vitest
# If any of them fails, the PR cannot be merged. Each step runs even if an earlier one failed,
# so one run reports all problems at once (`if: always()`).
jobs:
  backend:
    name: Backend (Python)
    # ⚠ **Runs on our own runner** (changed when moving to forge).
    runs-on: [self-hosted, nolumialab]
    env:
      # Python is also fetched from forge's mirror (task #171; it only holds cpython 3.11.16, 3.12.14 and 3.14.7 for x86_64 Linux).
      UV_PYTHON_INSTALL_MIRROR: "https://git.nolumia.com/astral-sh/python-build-standalone/releases/download"
    # ⚠ The default is 6 hours. Set a limit so a hung job does not eat up quota and runners.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Check Python version matches the production image
        # ⚠ **Tests use the Python version in `.python-version`** (read by uv). Fail if it drifts from
        #   the production image (`FROM python:X.Y` in the Dockerfile). Renovate bumps both in one PR (task #461).
        #   CI had stayed on 3.12 while production had moved to 3.14.
        run: |
          want="$(tr -d '[:space:]' < .python-version)"
          got="$(git ls-files 'Dockerfile' '*/Dockerfile' | xargs grep -hoE '^FROM +python:[0-9]+\.[0-9]+' | sed -E 's/^FROM +python://' | sort -u)"
          echo ".python-version: ${want} / Dockerfile: ${got//$'\n'/ }"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "::error::.python-version (${want}) does not match Dockerfile FROM python (${got//$'\n'/ })"
            exit 1
          fi

      - name: Set up uv
        # ⚠ Pin the full version here only. Since v8, setup-uv no longer publishes
        #   moving major tags like `@v10` as a supply-chain measure
        #   (to avoid attacks that replace a tag). Rewrite the version to upgrade.
        # ⚠ **Not in the default mirror, so point at our own mirror by full URL** (since moving to forge).
        uses: https://git.nolumia.com/astral-sh/setup-uv@v10.0.1
        with:
          # No version: use the latest in the manifest-file list (forge copy, synced weekly). With manifest-file, the GitHub API is not called (2026-10-27).
          manifest-file: "https://git.nolumia.com/astral-sh/uv/raw/branch/main/uv.ndjson"
          download-from-astral-mirror: false
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff Format (code formatting)
        run: uv run ruff format --check .

      - name: Ruff Check (static analysis)
        if: always()
        run: uv run ruff check .

      # Nesting depth and positional arguments (ADR-0016). These are preview rules, so they are not
      # in the main select; this step selects just these 2 rules explicitly.
      - name: Ruff Check (nesting depth, positional args)
        if: always()
        run: uv run ruff check --preview --select PLR1702,PLR0917 .

      - name: MyPy (type check)
        if: always()
        run: uv run mypy

      - name: PyTest (tests)
        if: always()
        run: uv run pytest -v --tb=short

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    # ⚠ **Runs on our own runner** (changed when moving to forge).
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        # For the display name only. The Node version comes from the image (not passed to setup-node; see below).
        node-version: ["24"]

    steps:
      - uses: actions/checkout@v6

      # ⚠ **Do not pass node-version** (task #171). If passed, it queries the api.github.com list first
      #   even with a mirror set. Use Node 24 from the job image (node:24-bookworm) as is.
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier (code formatting)
        run: npm run format:check

      - name: ESLint (static analysis)
        if: always()
        run: npm run lint

      - name: TypeScript (type check)
        if: always()
        run: npm run type-check

      - name: Vitest (tests)
        if: always()
        run: npm run test

      - name: Build (Vite)
        if: always()
        run: npm run build
