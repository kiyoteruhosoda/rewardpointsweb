# Override for running `docker compose up -d` directly from the source tree.
#
# The main docker-compose.yml only references an image and has no build. As is,
# `docker compose up` would look for the image in the registry, so add build here
# so that locally compose builds the image and then starts it.
#
# This is also where .env becomes optional. Overriding the same path as the main `env_file: [.env]`
# with the long syntax makes `required: false` win, so it starts without .env (${VAR:-default}
# supplies the values). The long syntax is only understood by Compose 2.24.0+, so it is not put
# in the main file used by deployments.
#
# This file is loaded automatically only when run without `-f`.
services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    env_file:
      - path: .env
        required: false

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # For version.json. If unset, the Dockerfile default (dev) is used.
        COMMIT_HASH: ${COMMIT_HASH:-dev}
        COMMIT_HASH_FULL: ${COMMIT_HASH_FULL:-dev}
        BRANCH: ${BRANCH:-unknown}
        COMMIT_DATE: ${COMMIT_DATE:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - path: .env
        required: false
