[project]
name = "rewardpointsweb"
version = "0.2.0"
description = "RewardPoints — 人ごとのポイントを記録・共有する PWA（FastAPI + DDD）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "gunicorn>=23.0.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pymysql>=1.1.0",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0",
    "httpx>=0.28.1",
    "werkzeug>=3.0.0",
    "pydantic[email]>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyotp>=2.9.0",
    "webauthn>=2.5.0",
    "qrcode>=8.0",
]

[dependency-groups]
dev = [
    # Since starlette 1.6.0, TestClient uses httpx2 (httpx is deprecated).
    # ⚠ Production code (identity_federation's httpx_* / oidc_metadata) still uses httpx.
    #    Only tests that use TestClient see httpx2's types.
    "httpx2>=2.13.0",
    "mypy>=1.14",
    "pillow>=12.3.0",
    "pytest>=9.0.3",
    "ruff>=0.11.0",
    "types-qrcode>=8.2.0.20260518",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tests"]
# importlib: avoid clashes between same-named test files / smtp: excluded by default as it needs external resources
addopts = "--import-mode=importlib -m 'not smtp'"
markers = [
    "smtp: requires a real SMTP server (excluded by default)",
]

[tool.mypy]
python_version = "3.12"

# Targets to check. There is no "src/" in this layout, so list the actual package roots
# (so `uv run mypy` with no arguments is the quality gate as is).
files = [
    "asgi.py",
    "main.py",
    "bounded_contexts",
    "migrations",
    "presentation",
    "scripts",
    "shared",
    "tests",
]

strict = true

pretty = true
show_error_codes = true
show_column_numbers = true

disallow_any_generics = true
disallow_subclassing_any = true

disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true

no_implicit_optional = true

warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

implicit_reexport = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: PEP8 compliance
    "F",    # Pyflakes: unused variables and imports
    "I",    # isort: import order
    "B",    # flake8-bugbear: bug-prone patterns
    "UP",   # pyupgrade: detect outdated Python syntax
    "SIM",  # flake8-simplify: simplify unnecessary branches
    "C4",   # flake8-comprehensions: better comprehensions
    "ARG",  # flake8-unused-arguments: unused arguments
    "N",    # pep8-naming: naming conventions
    "RET",  # flake8-return: better returns
    "PTH",  # flake8-use-pathlib: prefer pathlib
    "RUF",  # Ruff-specific rules
    # Quantitative design-quality limits (ADR-0008). Thresholds live in [tool.ruff.lint.mccabe] /
    # [tool.ruff.lint.pylint].
    "C901",    # complexity
    "PLR0912", # number of branches
    "PLR0913", # number of arguments
    "PLR0915", # number of statements (proxy for function length)
]

ignore = [
    # FastAPI's Depends()/Cookie()/Query() are meant to be called in argument defaults
    "B008",
    # This project contains Japanese text, where full-width brackets and commas are intentional.
    # RUF001-003 (ambiguous-unicode-character) only produce false positives, so they are excluded.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
# As in the development standard. There were 0 violations when introduced (ADR-0008).
max-complexity = 10

[tool.ruff.lint.pylint]
# Branches and statements. Ruff has no rule for the 30-line function length itself,
# so approximate it with the statement count (30). There were 0 violations of either when introduced (ADR-0008).
max-branches = 8
max-statements = 30
# Arguments: 5, not the development standard's 3. PLR0913 also counts keyword-only arguments and FastAPI's
# Depends() as one each, so a limit of 3 would flag places where caller readability
# is not harmed (reasoning and measurements in ADR-0008).
max-args = 5
# Nesting depth and positional arguments are 3, as in the development standard. The matching PLR1702 / PLR0917 are
# preview rules, so they are not in the main `ruff check` select; instead a separate command that
# selects just these 2 rules checks them (see Makefile check-backend / CI)
# (ADR-0016).
max-nested-blocks = 3
max-positional-args = 3

[tool.ruff.lint.per-file-ignores]
# ARG001: pytest fixtures are sometimes received as arguments without being referenced
# ARG002: test doubles declare unused arguments to satisfy an interface
"tests/*" = ["ARG001", "ARG002"]
