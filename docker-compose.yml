# compose project name. Without it, the directory name is used, so just cloning the repository
# into a differently named directory changes the container and network names.
# `-p` takes precedence when passed (-p > COMPOSE_PROJECT_NAME > this name > directory name).
name: rewardpointsweb

services:
  init-paths:
    image: alpine
    command: >
      sh -c "
        echo '[init] ensure dirs exist';
        mkdir -p /host/db_data;
        mkdir -p /host/data;
        echo '[init] apply correct ownership';
        chown -R 999:999 /host/db_data;
        chmod -R 770 /host/db_data;
        chown -R 1000:1000 /host/data;
        chmod -R 775 /host/data;
        echo '[init] done';
      "
    volumes:
      - ${HOST_DATA_ROOT:-./mnt}:/host
    restart: "no"

  db:
    image: ${DB_IMAGE:-rewardpointsweb-db:latest}
    container_name: ${DB_CONTAINER_NAME:-rewardpointsweb-mariadb}
    environment:
      - TZ=UTC
      # Defaults are provided so the DB initializes even with no setup (no .env / empty entries).
      # The default credentials are for development. Always override them in .env when exposed externally.
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-template123}
      - MARIADB_USER=${MARIADB_USER:-web_user}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-template123}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-appdb}
    # Not exposed to the host. Reachable only from within the same Docker network;
    # maintenance connections are also made from inside the container with `docker compose exec db`
    # (steps in docs/OPERATIONS.md "DB に直接つなぎたいとき").
    expose:
      - "3306"
    # Keep the short syntax here. The long syntax with `required:` needs Compose 2.24.0+,
    # and older Compose (e.g. Synology Container Manager) rejects it before loading.
    # .env is made optional in docker-compose.override.yml (local only).
    env_file:
      - .env
    volumes:
      - ${HOST_DATA_ROOT:-./mnt}/db_data:/var/lib/mysql
    command:
      - --default-time-zone=+00:00
    depends_on:
      init-paths:
        condition: service_completed_successfully
    healthcheck:
      # Escape with $$ so compose does not expand the password and it is passed as a reference
      # to the in-container shell's environment variable. --protocol=tcp is explicit: over the socket,
      # ping also succeeds against the temporary bootstrap server during first init, causing a false healthy.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 10s
      # The first start (empty db_data) can take several minutes to initialize system tables.
      # The probe still runs every interval during start_period and turns healthy as soon as it succeeds,
      # so a long value does not slow down later starts.
      retries: 30
      start_period: 600s

  web:
    image: ${WEB_IMAGE:-rewardpointsweb:latest}
    init: true
    stop_grace_period: 60s
    command: web
    # nginx owns the public port. web is reachable only from inside the network.
    expose:
      - "8000"
    environment:
      - TZ=UTC
      - DATABASE_URI=mysql+pymysql://${MARIADB_USER:-web_user}:${MARIADB_PASSWORD:-template123}@db:3306/${MARIADB_DATABASE:-appdb}?charset=utf8mb4
    # Short syntax for the same reason as db (works with any Compose version at the deployment).
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${HOST_DATA_ROOT:-./mnt}/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 30s
      timeout: 10s
      # Even after db is healthy, web waits for a DB connection and runs alembic upgrade head
      # before starting. The first run (empty DB) also builds the schema, so allow extra time.
      retries: 5
      start_period: 300s

  nginx:
    image: nginx:1.30-alpine
    # Public front. External reverse proxies connect to this port.
    ports:
      - "${WEB_BIND_ADDR:-127.0.0.1}:${WEB_HOST_PORT:-8080}:80"
    environment:
      - TZ=UTC
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-rewardpointsweb}
